[project]
name = "careerpath-mlops"
version = "0.1.0"
description = "API de inferência socioeconômica para a prova de conceito CareerPath"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "bentoml==1.4.39",
    "pandas==3.0.5",
    "pydantic==2.13.5",
    "scikit-learn==1.9.1",
    "starlette==1.6.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerpath"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
